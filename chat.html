<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Чат — Тихое место</title>
  <link rel="stylesheet" href="style.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet">
</head>

<body class="light-theme chat-page">
  <div class="chat-app">
    <div class="chat-bg-gradient"></div>
    <div class="chat-bg-blur"></div>

    <div class="chat-header">
      <a href="index.html" class="chat-back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Выйти</span>
      </a>
      <div style="display: flex; align-items: center; gap: 0.8rem;">
        <button id="themeToggleChat" class="theme-toggle">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">Тёмная</span>
        </button>
        <div class="chat-header-info">
          <div class="status-dot pulse"></div>
          <span class="chat-status-text" id="chatStatusText">Подключение...</span>
        </div>
      </div>
      <button id="panicBtn" class="chat-panic-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>Стереть всё</span>
      </button>
    </div>

    <div id="chatMessages" class="chat-messages-page">
      <div class="message-system">
        <span class="msg-icon">🤝</span>
        <span>Ты в безопасном пространстве. Волонтёр не знает, кто ты.</span>
      </div>
      <div class="message-system" id="waitingMessage">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span>Ищем свободного волонтёра...</span>
      </div>
    </div>

    <div class="chat-input-page">
      <div class="input-container-page">
        <textarea id="chatInput" placeholder="Напиши что-нибудь..." rows="1" disabled></textarea>
        <button id="sendChatBtn" class="send-btn-page" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="chat-note">
        <span>🔒 Анонимно · 💬 Не хранится дольше 24 часов</span>
      </div>
    </div>
  </div>

  <script src="chat.js"></script>
</body>

</html>
